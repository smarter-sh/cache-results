# Codecov merges the coverage of every CI test job (flags locmem and redis).
coverage:
  status:
    project:
      default:
        target: 95%
        threshold: 1%
    patch:
      default:
        target: 95%

comment:
  layout: "condensed_header, diff, flags, files"
  require_changes: true

flag_management:
  default_rules:
    carryforward: false
