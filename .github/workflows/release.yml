---
#------------------------------------------------------------------------------
# Release: run by hand from the Actions tab, on main (or alpha or beta, for a
# prerelease).
#
# - release: semantic-release reads the conventional commits since the last
#   tag, and, if they call for a release, writes the version into
#   src/cache_results/__version__.py, updates CHANGELOG.md, commits both, tags
#   the commit and publishes a GitHub release. See release.config.js. It runs
#   as a dry run unless dry_run is unchecked.
# - build: builds the sdist and wheel from the new tag.
# - publish: uploads them to PyPI with trusted publishing. It is skipped until
#   the repository variable PUBLISH_TO_PYPI is "true", and needs a "pypi"
#   environment, and this workflow registered as a trusted publisher on PyPI.
#
# Pushing to a protected branch needs the repository secret PAT, a token
# allowed to push to it. Without it, GITHUB_TOKEN is used.
#------------------------------------------------------------------------------
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: report the next version without releasing"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Semantic release
        id: semantic
        uses: cycjimmy/semantic-release-action@v8
        with:
          dry_run: ${{ inputs.dry_run }}
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
      - name: Summary
        run: |
          {
            echo "Dry run: ${{ inputs.dry_run }}"
            echo "Last release: ${{ steps.semantic.outputs.last_release_version || 'none' }}"
            echo "Next release: ${{ steps.semantic.outputs.new_release_version || 'none' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: release
    if: needs.release.outputs.published == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build and check the distributions
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
          # the tag's __version__.py, written by semantic-release, must be the released version.
          grep -qx '__version__ = "${{ needs.release.outputs.version }}"' src/cache_results/__version__.py \
            || { echo "src/cache_results/__version__.py doesn't match the release"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cache-results/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
